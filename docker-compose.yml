version: '3.8'

services:
  # M-Lab NDT7 Prometheus Exporter
  # Builds directly from the official M-Lab GitHub repository.
  ndt7-exporter:
    build: https://github.com/m-lab/ndt7-client-go.git#main
    container_name: ndt7-exporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Optional: You can pass flags to the ndt7-client if needed
    # command: ["-format=json"]

  # Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Change this after first login

volumes:
  prometheus_data:
  grafana_data:
