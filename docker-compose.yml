services:
  # M-Lab NDT7 Prometheus Exporter
  # Build from a stable tag (main is currently broken for Go 1.20-based Dockerfile).
  ndt7-exporter:
    build: https://github.com/m-lab/ndt7-client-go.git#v0.9.1
    container_name: ndt7-exporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Run a fixed probe every 30 minutes.
    command:
      - --port=8080
      - --period_mean=30m
      - --period_min=30m
      - --period_max=30m

  # Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Change this after first login

volumes:
  prometheus_data:
  grafana_data:
